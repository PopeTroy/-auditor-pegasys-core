name: Auditor Pegasys Chronos Engine

on:
  repository_dispatch:
    types: [pegasys_hunt_event]
  workflow_dispatch:
    inputs:
      node_payload:
        description: 'Target Subject / Node'
        required: false
      user_alias:
        description: 'User Alias'
        required: false
      jurisdiction:
        description: 'Jurisdiction / Location'
        required: false
      industry:
        description: 'Industry Classification'
        required: false
      session_id:
        description: 'Session Identifier'
        required: false

permissions:
  contents: write

jobs:
  run-audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Chronos Sweep
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NVIDIA_NIM_API_KEY: ${{ secrets.NVIDIA_NIM_API_KEY }}
          EVENT_PAYLOAD: ${{ toJson(github.event.client_payload || github.event.inputs) }}
          INPUT_NODE: ${{ github.event.client_payload.target_node || inputs.node_payload }}
          INPUT_USER_ALIAS: ${{ github.event.client_payload.user_alias || inputs.user_alias }}
          INPUT_JURISDICTION: ${{ github.event.client_payload.jurisdiction || inputs.jurisdiction }}
          INPUT_INDUSTRY: ${{ github.event.client_payload.industry || inputs.industry }}
          INPUT_SESSION_ID: ${{ inputs.session_id }}
          SESSION_GUID: ${{ github.event.client_payload.session_guid || github.event.client_payload.session_id || inputs.session_id }}
          SESSION_COLOR: ${{ github.event.client_payload.session_color }}
        run: python cli_audit.py

      - name: Commit Session Results
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git pull origin main --rebase || true
          git add sessions/ last_audit_results.json audits/
          git commit -m "Commit session diagnostic output [skip ci]" || exit 0
          git push origin main
